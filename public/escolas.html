<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Escolas e pagamentos | Controle Escolar</title><style>
:root{--navy:#102a50;--blue:#2e73e8;--bg:#f5f8ff;--text:#1d2e4b;--muted:#7b8aa2;--border:#dfe7f2;--green:#179c54;--red:#d74242}*{box-sizing:border-box;font-family:Inter,Arial,Helvetica,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}.shell{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.title{display:flex;align-items:center;gap:12px}.title-icon{width:40px;height:40px;border-radius:10px;background:#e9f2ff;color:var(--blue);display:grid;place-items:center}.title-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.top h1{font-size:20px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.back{background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;padding:10px 14px;font-size:12px}.content{padding:28px;max-width:1350px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.card,.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}.panel{padding:0;overflow:hidden}.panel-head{height:54px;border-bottom:1px solid #e9eef5;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.panel-head h2{font-size:15px;margin:0}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dce5f0;border-radius:8px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#7eabf3}.btn{width:100%;border:0;border-radius:8px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3fc;color:#31506f}.btn.danger{background:#fff0f0;color:#c43232;border:1px solid #f0caca}.actions{display:flex;gap:10px;flex-wrap:wrap}.alert{display:none;margin-bottom:15px;padding:12px;border-radius:9px;font-size:12px}.alert.show{display:block}.ok{background:#eafaf1;color:#17834b}.err{background:#fff0f0;color:#c53333}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{background:#f7f9fc;color:#71809a;font-size:10px;text-align:left;padding:12px 13px}.table td{border-top:1px solid #edf1f6;padding:11px 13px;font-size:11px;color:#5d6d86}.badge{padding:4px 8px;border-radius:18px;font-size:9px;font-weight:800;background:#eafaf1;color:#168447}.badge.off{background:#fff0f0;color:#c53c3c}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:30px;color:#8b98aa}@media(max-width:900px){.grid{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 16px}.form-row{grid-template-columns:1fr}}
</style><link rel="stylesheet" href="css/responsive.css">
</head><body><div class="shell"><header class="top"><div class="title"><div class="title-icon"><svg viewBox="0 0 24 24"><path d="M3 21h18M5 21V8l7-5 7 5v13M9 21v-5h6v5M8 11h8"/></svg></div><div><h1>Escolas e pagamentos</h1><p>Área exclusiva do Super Admin para gestão das escolas</p></div></div><a class="back" href="dashboard.html">← Dashboard</a></header><main class="content"><div id="alert" class="alert"></div><div class="grid"><section class="card"><h2 style="font-size:16px;margin-bottom:17px">Cadastrar escola</h2><form id="form"><div class="field"><label>Nome da escola *</label><input id="nome" required></div><div class="field"><label>CNPJ</label><input id="cnpj"></div><div class="form-row"><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Telefone</label><input id="telefone"></div></div><div class="form-row"><div class="field"><label>Valor mensal</label><input id="valor" type="number" step="0.01" min="0" value="0"></div><div class="field"><label>Vencimento (dia)</label><input id="vencimento" type="number" min="1" max="28" value="10"></div></div><button class="btn">Cadastrar escola</button></form></section><section class="panel"><div class="panel-head"><h2>Escolas cadastradas</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Escola</th><th>Status</th><th>Alunos</th><th>Valor</th><th>Último pagamento</th><th>Ações</th></tr></thead><tbody id="lista"><tr><td colspan="6" class="empty">Carregando...</td></tr></tbody></table></div></section></div><div class="panel" style="margin-top:20px"><div class="panel-head"><h2 id="pagTitulo">Histórico de pagamentos</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Referência</th><th>Valor</th><th>Status</th><th>Data</th><th>Observação</th></tr></thead><tbody id="pagamentos"><tr><td colspan="5" class="empty">Selecione uma escola.</td></tr></tbody></table></div></div></main></div><script src="js/auth.js"></script><script>const PERFIS_PERMITIDOS='SUPER_ADMIN';</script><script>const alertBox=document.getElementById('alert'),lista=document.getElementById('lista'),pag=document.getElementById('pagamentos');let escolasData=[];function aviso(m,ok=true){alertBox.className='alert show '+(ok?'ok':'err');alertBox.textContent=m;setTimeout(()=>alertBox.classList.remove('show'),5000)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function moeda(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}async function carregar(){const r=await fetch('/api/escolas',{headers:cabecalhosAutenticados()});const d=await r.json();if(!r.ok){aviso(d.erro||'Erro',false);return}escolasData=d;lista.innerHTML=d.length?d.map(e=>`<tr><td><strong>${esc(e.nome)}</strong><br><span style="font-size:9px;color:#8d99aa">${esc(e.email||'')}</span></td><td><span class="badge ${e.ativa?'':'off'}">${e.ativa?'Ativa':'Desativada'}</span></td><td>${e.alunos_ativos||0}</td><td>${moeda(e.valor_mensal)}</td><td>${e.ultimo_pagamento_confirmado?new Date(e.ultimo_pagamento_confirmado).toLocaleDateString('pt-BR'):'—'}</td><td><div class="actions"><button class="btn secondary" style="width:auto" onclick="selecionar(${e.id})">Pagamentos</button><button class="btn ${e.ativa?'danger':'secondary'}" style="width:auto" onclick="statusEscola(${e.id},${e.ativa?0:1})">${e.ativa?'Desativar':'Ativar'}</button><button class="btn" style="width:auto" onclick="registrarPagamento(${e.id},${Number(e.valor_mensal||0)})">Registrar pagamento</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhuma escola cadastrada.</td></tr>'}async function statusEscola(id,ativa){const r=await fetch('/api/escolas/'+id+'/ativo',{method:'PATCH',headers:{'Content-Type':'application/json',...cabecalhosAutenticados()},body:JSON.stringify({ativa:Boolean(ativa)})});const d=await r.json();aviso(d.mensagem||d.erro,r.ok);if(r.ok)carregar()}async function registrarPagamento(id,valorPadrao){const referencia=prompt('Referência do pagamento (ex.: 09/2026):','09/2026');if(referencia===null)return;const valorTexto=prompt('Valor do pagamento:',String(valorPadrao||0));if(valorTexto===null)return;const valor=Number(valorTexto.replace(',','.'));if(!valor||valor<=0){aviso('Informe um valor válido.',false);return}const observacao=prompt('Observação (opcional):','');const r=await fetch('/api/escolas/'+id+'/pagamentos',{method:'POST',headers:{'Content-Type':'application/json',...cabecalhosAutenticados()},body:JSON.stringify({valor,referencia,observacao,status:'PAGO'})});const d=await r.json();aviso(d.mensagem||d.erro,r.ok);if(r.ok){await carregar();await selecionar(id)}}async function selecionar(id){const escola=escolasData.find(e=>Number(e.id)===Number(id));document.getElementById('pagTitulo').textContent='Histórico de pagamentos — '+(escola?.nome||'Escola');const r=await fetch('/api/escolas/'+id+'/pagamentos',{headers:cabecalhosAutenticados()});const d=await r.json();if(!r.ok){pag.innerHTML=`<tr><td colspan="5" class="empty">${esc(d.erro||'Erro')}</td></tr>`;return}pag.innerHTML=d.length?d.map(p=>`<tr><td>${esc(p.referencia||'—')}</td><td>${moeda(p.valor)}</td><td><span class="badge ${p.status==='PAGO'?'':'off'}">${esc(p.status)}</span></td><td>${p.pago_em?new Date(p.pago_em).toLocaleDateString('pt-BR'):'—'}</td><td>${esc(p.observacao||'—')}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">Nenhum pagamento lançado.</td></tr>'}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/api/escolas',{method:'POST',headers:{'Content-Type':'application/json',...cabecalhosAutenticados()},body:JSON.stringify({nome:document.getElementById('nome').value,cnpj:document.getElementById('cnpj').value,email:document.getElementById('email').value,telefone:document.getElementById('telefone').value,valor_mensal:Number(document.getElementById('valor').value||0),vencimento_dia:Number(document.getElementById('vencimento').value||10)})});const d=await r.json();if(!r.ok){aviso(d.erro||'Erro',false);return}e.target.reset();aviso('✅ Escola cadastrada com sucesso.');carregar()});async function iniciar(){if(!(await protegerPagina(['SUPER_ADMIN'])))return;aplicarTravaMenu();carregar()}iniciar();</script><script src="js/global-sidebar.js"></script>
</body></html>
