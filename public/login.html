<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | Sistema de Presença</title>
<link rel="stylesheet" href="css/login.css">
<link rel="stylesheet" href="css/responsive.css">
</head>
<body>
<main class="login-container">
<section class="login-card">
<div class="logo">🏫</div>
<h1>Sistema de Presença</h1>
<p class="subtitulo">Acesse o painel da escola</p>
<form id="formLogin">
<label for="email">E-mail</label>
<input type="email" id="email" placeholder="Digite seu e-mail" required>
<label for="senha">Senha</label>
<input type="password" id="senha" placeholder="Digite sua senha" required>
<button type="submit">Entrar</button>
</form>
<p id="erroLogin" role="alert"></p>
<a href="index.html" class="voltar">← Voltar para a página inicial</a>
</section>
</main>
<script>
document.getElementById('formLogin').addEventListener('submit', async (evento) => {
 evento.preventDefault();
 const erro=document.getElementById('erroLogin'); erro.textContent='';
 try{
  const resposta=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,senha:document.getElementById('senha').value})});
  const dados=await resposta.json();
  if(!resposta.ok){erro.textContent=dados.erro||'Não foi possível entrar.';return;}
  localStorage.setItem('token',dados.token); localStorage.setItem('usuario',JSON.stringify(dados.usuario));
  window.location.href=dados.usuario?.perfil==='PROFESSOR'?'professor.html':'dashboard.html';
 }catch(e){erro.textContent='Não foi possível conectar ao servidor.';console.error(e);}
});
</script>
</body>
</html>
