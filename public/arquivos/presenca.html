<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar presença | Controle Escolar</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: #f5f8ff; color: #17213a; }
        header { height: 75px; padding: 0 7%; display: flex; align-items: center; justify-content: space-between; background: #fff; border-bottom: 1px solid #e4e9f3; }
        h1 { font-size: 22px; margin: 0 0 5px; } header p { margin: 0; color: #71809d; font-size: 12px; }
        a { color: #fff; background: #2864e8; padding: 11px 16px; border-radius: 9px; text-decoration: none; font-size: 13px; }
        main { max-width: 680px; padding: 45px 20px; margin: auto; }
        .card { background: #fff; border: 1px solid #e4e9f3; border-radius: 16px; padding: 32px; box-shadow: 0 8px 24px rgba(40,64,100,.06); }
        .icon { width: 68px; height: 68px; border-radius: 16px; display: grid; place-items: center; background: #edf3ff; font-size: 32px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin: 25px 0 8px; } input { width: 100%; padding: 15px; border: 1px solid #dce3ef; border-radius: 9px; font-size: 16px; } input:focus { outline: 2px solid #b8d0ff; border-color: #2864e8; }
        button { width: 100%; margin-top: 16px; border: 0; border-radius: 9px; padding: 14px; background: #2864e8; color: white; cursor: pointer; font-weight: bold; font-size: 15px; }
        #mensagem { min-height: 24px; margin: 18px 0 0; padding: 12px; border-radius: 8px; } .sucesso { background: #eafaf1; color: #168445; } .erro { background: #fff0f0; color: #c62828; }
        .hint { color: #71809d; font-size: 13px; line-height: 1.5; }
    </style>
<link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <header><div><h1>📱 Registrar presença</h1><p>Leia o QR Code do crachá ou use o leitor USB.</p></div><a href="dashboard.html">← Dashboard</a></header>
    <main><section class="card"><div class="icon">📷</div><h2>Registrar entrada ou saída</h2><p class="hint">Ao ler o mesmo QR Code, o sistema alterna automaticamente entre entrada e saída no dia atual.</p>
        <form id="formPresenca"><label for="codigoQr">Código do QR Code</label><input id="codigoQr" autocomplete="off" autofocus placeholder="Aponte o leitor para o QR Code" required><button>Registrar presença</button></form>
        <p id="mensagem" role="status"></p>
    </section></main>
    <script src="js/auth.js"></script>
    <script>
        const campo = document.getElementById('codigoQr');
        async function iniciar() { if (await exigirAutenticacao()) campo.focus(); }
        document.getElementById('formPresenca').addEventListener('submit', async (evento) => {
            evento.preventDefault();
            const mensagem = document.getElementById('mensagem');
            mensagem.className = ''; mensagem.textContent = '';
            const resposta = await fetch('/api/presencas/registrar', { method: 'POST', headers: { 'Content-Type': 'application/json', ...cabecalhosAutenticados() }, body: JSON.stringify({ codigo_qr: campo.value }) });
            const dados = await resposta.json();
            mensagem.className = resposta.ok ? 'sucesso' : 'erro';
            mensagem.textContent = resposta.ok ? `${dados.mensagem} Aluno: ${dados.registro.aluno.nome}.` : dados.erro;
            if (resposta.ok) { campo.value = ''; campo.focus(); }
        });
        iniciar();
    </script>
</body>
</html>
