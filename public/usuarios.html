<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Usuários do sistema | Controle Escolar</title><style>
:root{--navy:#102a50;--blue:#2e73e8;--bg:#f5f8ff;--text:#1d2e4b;--muted:#7b8aa2;--border:#dfe7f2;--green:#179c54;--red:#d74242}*{box-sizing:border-box;font-family:Inter,Arial,Helvetica,sans-serif}body{margin:0;background:var(--bg);color:var(--text)}.shell{min-height:100vh}.top{height:70px;background:#fff;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;padding:0 28px;position:sticky;top:0;z-index:5}.title{display:flex;align-items:center;gap:12px}.title-icon{width:40px;height:40px;border-radius:10px;background:#e9f2ff;color:var(--blue);display:grid;place-items:center}.title-icon svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8}.top h1{font-size:20px;margin:0}.top p{font-size:11px;color:var(--muted);margin:3px 0 0}.back{background:var(--blue);color:#fff;text-decoration:none;border-radius:8px;padding:10px 14px;font-size:12px}.content{padding:28px;max-width:1350px;margin:auto}.grid{display:grid;grid-template-columns:360px 1fr;gap:20px}.card,.panel{background:#fff;border:1px solid var(--border);border-radius:12px;padding:20px}.panel{padding:0;overflow:hidden}.panel-head{height:54px;border-bottom:1px solid #e9eef5;display:flex;align-items:center;justify-content:space-between;padding:0 18px}.panel-head h2{font-size:15px;margin:0}.field{margin-bottom:13px}.field label{display:block;font-size:11px;font-weight:700;margin-bottom:5px}.field input,.field select{width:100%;padding:11px 12px;border:1px solid #dce5f0;border-radius:8px;outline:none;background:#fff}.field input:focus,.field select:focus{border-color:#7eabf3}.btn{width:100%;border:0;border-radius:8px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#edf3fc;color:#31506f}.btn.danger{background:#fff0f0;color:#c43232;border:1px solid #f0caca}.actions{display:flex;gap:10px;flex-wrap:wrap}.alert{display:none;margin-bottom:15px;padding:12px;border-radius:9px;font-size:12px}.alert.show{display:block}.ok{background:#eafaf1;color:#17834b}.err{background:#fff0f0;color:#c53333}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{background:#f7f9fc;color:#71809a;font-size:10px;text-align:left;padding:12px 13px}.table td{border-top:1px solid #edf1f6;padding:11px 13px;font-size:11px;color:#5d6d86}.badge{padding:4px 8px;border-radius:18px;font-size:9px;font-weight:800;background:#eafaf1;color:#168447}.badge.off{background:#fff0f0;color:#c53c3c}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.empty{text-align:center;padding:30px;color:#8b98aa}@media(max-width:900px){.grid{grid-template-columns:1fr}.content{padding:18px}.top{padding:0 16px}.form-row{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="title"><div class="title-icon"><svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2M9.5 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM20 8v6M17 11h6"/></svg></div><div><h1>Usuários do sistema</h1><p>Cadastre vice-direção, coordenação, secretaria e demais perfis</p></div></div><a class="back" href="dashboard.html">← Dashboard</a></header><main class="content"><div id="alert" class="alert"></div><div class="grid"><section class="card"><h2 style="font-size:16px;margin-bottom:17px">Novo usuário do sistema</h2><form id="form"><div class="field"><label>Nome completo *</label><input id="nome" required></div><div class="field"><label>E-mail *</label><input id="email" type="email" required></div><div class="field"><label>Perfil *</label><select id="tipo"><option value="ADMIN">Administrador</option><option value="VICE_DIRECAO">Vice-direção</option><option value="COORDENACAO">Coordenação</option><option value="SECRETARIA">Secretaria</option><option value="PROFESSOR">Professor</option></select></div><div class="field"><label>Senha *</label><input id="senha" type="password" minlength="6" required></div><div class="field" id="escolaField" style="display:none"><label>Escola *</label><select id="escola_id"><option value="">Selecione...</option></select></div><button class="btn">Cadastrar usuário</button></form></section><section class="panel"><div class="panel-head"><h2>Usuários cadastrados</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Escola</th><th>Status</th><th></th></tr></thead><tbody id="lista"><tr><td colspan="6" class="empty">Carregando...</td></tr></tbody></table></div></section></div></main></div><script src="js/auth.js"></script><script>const PERFIS_PERMITIDOS='SUPER_ADMIN,ADMIN';</script><script>const alertBox=document.getElementById('alert'),lista=document.getElementById('lista');const nomes={ADMIN:'Administrador',PROFESSOR:'Professor',VICE_DIRECAO:'Vice-direção',COORDENACAO:'Coordenação',SECRETARIA:'Secretaria'};function aviso(m,ok=true){alertBox.className='alert show '+(ok?'ok':'err');alertBox.textContent=m;setTimeout(()=>alertBox.classList.remove('show'),4500)}function escapar(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}async function escolas(){if(!ehSuperAdmin())return;document.getElementById('escolaField').style.display='block';const r=await fetch('/api/escolas',{headers:cabecalhosAutenticados()});const d=await r.json();if(r.ok)document.getElementById('escola_id').innerHTML='<option value="">Selecione...</option>'+d.map(e=>`<option value="${e.id}">${escapar(e.nome)}</option>`).join('')}async function carregar(){const r=await fetch('/api/usuarios',{headers:cabecalhosAutenticados()});const d=await r.json();if(!r.ok){aviso(d.erro||'Erro',false);return}lista.innerHTML=d.length?d.map(u=>`<tr><td>${escapar(u.nome)}</td><td>${escapar(u.email)}</td><td>${escapar(nomes[u.tipo]||u.tipo)}</td><td>${escapar(u.escola_nome||'Todas')}</td><td><span class="badge ${u.ativo?'':'off'}">${u.ativo?'Ativo':'Inativo'}</span></td><td><button class="btn danger" style="width:auto;padding:6px 9px" onclick="alternar(${u.id},${u.ativo?0:1})">${u.ativo?'Desativar':'Ativar'}</button></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nenhum usuário encontrado.</td></tr>'}async function alternar(id,ativo){const r=await fetch('/api/usuarios/'+id+'/ativo',{method:'PATCH',headers:{'Content-Type':'application/json',...cabecalhosAutenticados()},body:JSON.stringify({ativo:Boolean(ativo)})});const d=await r.json();aviso(d.mensagem||d.erro,!r.ok?false:true);if(r.ok)carregar()}document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const body={nome:document.getElementById('nome').value,email:document.getElementById('email').value,senha:document.getElementById('senha').value,tipo:document.getElementById('tipo').value};if(document.getElementById('escola_id').value)body.escola_id=Number(document.getElementById('escola_id').value);const r=await fetch('/api/usuarios',{method:'POST',headers:{'Content-Type':'application/json',...cabecalhosAutenticados()},body:JSON.stringify(body)});const d=await r.json();if(!r.ok){aviso(d.erro||'Erro',false);return}e.target.reset();aviso('✅ Usuário cadastrado com sucesso.');carregar()});async function iniciar(){if(!(await protegerPagina(PERFIS_PERMITIDOS.split(','))))return;aplicarTravaMenu();await escolas();await carregar()}iniciar();</script></body></html>
