<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatórios | Controle Escolar</title>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}body{margin:0;background:#f5f8ff;color:#17213a}.top{height:75px;background:#fff;border-bottom:1px solid #e4e9f3;display:flex;justify-content:space-between;align-items:center;padding:0 35px}.top h1{font-size:22px;margin:0}.top p{font-size:12px;color:#7c88a0;margin:5px 0 0}.back{background:#2864e8;color:#fff;text-decoration:none;border-radius:9px;padding:11px 16px}.content{padding:30px 35px}.filters,.panel{background:#fff;border:1px solid #e4e9f3;border-radius:14px;padding:20px}.filters{display:grid;grid-template-columns:repeat(4,1fr) auto;gap:12px;align-items:end;margin-bottom:20px}.field label{display:block;font-size:11px;font-weight:bold;margin-bottom:6px}.field input,.field select{width:100%;padding:10px;border:1px solid #dce3ef;border-radius:8px}.btn{border:0;background:#2864e8;color:#fff;padding:11px 16px;border-radius:8px;cursor:pointer;font-weight:bold}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid #edf0f5;text-align:left;font-size:12px}.entry{color:#168445;font-weight:bold}.exit{color:#2864e8;font-weight:bold}.actions{display:flex;gap:10px;align-items:center;margin-bottom:12px}.meta{font-size:12px;color:#76839b}@media(max-width:900px){.filters{grid-template-columns:1fr 1fr}.content{padding:20px 15px}}@media(max-width:600px){.filters{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top"><div><h1>📊 Relatórios</h1><p>Histórico de entradas e saídas</p></div><a class="back" href="dashboard.html">← Dashboard</a></header>
<main class="content">
<div class="filters">
<div class="field"><label>Data inicial</label><input type="date" id="inicio"></div>
<div class="field"><label>Data final</label><input type="date" id="fim"></div>
<div class="field"><label>Aluno</label><select id="aluno"><option value="">Todos os alunos</option></select></div>
<div class="field"><label>&nbsp;</label><button class="btn" id="filtrar">Filtrar</button></div>
<div class="meta" id="total">0 registros</div>
</div>
<section class="panel">
<div class="actions"><strong>Histórico</strong><button class="btn" id="csv">Exportar CSV</button></div>
<div style="overflow:auto"><table class="table"><thead><tr><th>Data/Hora</th><th>Aluno</th><th>Matrícula</th><th>Turma</th><th>Tipo</th><th>Dispositivo</th></tr></thead><tbody id="lista"></tbody></table></div>
</section>
</main>
<script src="js/auth.js"></script>
<script>
let dados=[];
const lista=document.getElementById('lista');
function fmt(v){return new Date(v).toLocaleString('pt-BR')}
async function carregarAlunos(){const r=await fetch('/api/alunos',{headers:cabecalhosAutenticados()});const a=await r.json();if(r.ok)document.getElementById('aluno').innerHTML='<option value="">Todos os alunos</option>'+a.map(x=>`<option value="${x.id}">${x.nome} — ${x.matricula}</option>`).join('')}
async function carregar(){if(!(await exigirAutenticacao()))return;const p=new URLSearchParams();for(const id of ['inicio','fim','aluno'])if(document.getElementById(id).value)p.set(id,document.getElementById(id).value);const r=await fetch('/api/presencas/historico?'+p.toString(),{headers:cabecalhosAutenticados()});const d=await r.json();if(!r.ok){lista.innerHTML='<tr><td colspan="6">Erro ao carregar.</td></tr>';return}dados=d;document.getElementById('total').textContent=d.length+' registro(s)';lista.innerHTML=d.length?d.map(x=>`<tr><td>${fmt(x.registrado_em)}</td><td>${x.nome}</td><td>${x.matricula}</td><td>${x.turma_nome}</td><td class="${x.tipo==='ENTRADA'?'entry':'exit'}">${x.tipo}</td><td>${x.dispositivo||'—'}</td></tr>`).join(''):'<tr><td colspan="6">Nenhum registro encontrado.</td></tr>'}
document.getElementById('filtrar').onclick=carregar;
document.getElementById('csv').onclick=()=>{if(!dados.length)return;const linhas=[['Data/Hora','Aluno','Matrícula','Turma','Tipo','Dispositivo'],...dados.map(x=>[fmt(x.registrado_em),x.nome,x.matricula,x.turma_nome,x.tipo,x.dispositivo||''])];const csv=linhas.map(l=>l.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';')).join('\n');const blob=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='relatorio-presenca.csv';a.click();URL.revokeObjectURL(a.href)}
carregarAlunos().then(carregar);
</script>
</body>
</html>
